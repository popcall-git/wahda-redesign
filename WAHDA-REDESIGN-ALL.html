<main data-page-node-id="aJ3oXoaxxjmnnOUZV5sAvk"><iframe id="frame" title="章节查看器" data-page-node-id="Ed2QmKVSlOBVncvL0UZwsJ"></iframe></main>

<script>
const CATS = [
  { id:'a', name:'账号与主页' },
  { id:'b', name:'注册与游客模式' },
  { id:'c', name:'Feeds 与互动' },
  { id:'d', name:'Places 与 My Hub' },
  { id:'e', name:'运营增长路径' },
];
const CH = [
  { f:'PROFILE-ACCOUNT-MERGED.html',   cat:'a', t:'个人主页&账号切换' },
  { f:'P002-comparison.html',           cat:'a', t:'Discover 首页 · 固定底栏 + Tab 徽章' },
  { f:'CREATE-ENTRY.html',              cat:'a', t:'创作入口 · 发布中枢' },
  { f:'NOTIFICATION-CENTER.html',       cat:'a', t:'通知中心 · 全局收件箱' },
  { f:'LOCATION-PRIVACY.html',          cat:'a', t:'位置展示与隐私' },
  { f:'SIGNUP-comparison.html',         cat:'b', t:'Sign Up 注册流程补全' },
  { f:'SIGNUP-STEP23-FLOW.html',        cat:'b', t:'注册 Step 2–3 引导流' },
  { f:'GUEST-FLOW.html',                cat:'b', t:'Guest Mode 游客模式' },
  { f:'FEEDS-DETAIL-MERGED.html',      cat:'c', t:'Feeds Detail 更新示意：身份透出 × 评论区' },
  { f:'PLACES-BLEND.html',              cat:'d', t:'Places 混合模式改造' },
  { f:'PLACES-VERIFY.html',             cat:'d', t:'Places 增强 · 社区清真认证评分' },
  { f:'MYHUB-WALLET.html',              cat:'d', t:'My Hub Wallet 入口' },
  { f:'PATH-PRAYER-FUNNEL.html',        cat:'e', t:'祈祷转化漏斗 · 5 步信任路径' },
];

const side = document.getElementById('side');
const frame = document.getElementById('frame');
const open = document.getElementById('open');
let cur = -1;

function buildNav(){
  side.innerHTML = CATS.map(g=>`
    <div class="g"><div class="g-t">${g.name}</div>
      ${CH.map((c,i)=> c.cat===g.id ? `<button data-i="${i}"><span class="no">${String(i+1).padStart(2,'0')}</span><span>${c.t}</span></button>` : '').join('')}
    </div>`).join('');
}
function select(i){
  cur = (i+CH.length)%CH.length;
  frame.src = CH[cur].f;
  open.href = CH[cur].f;
  document.querySelectorAll('#side button').forEach(el=>{
    el.classList.toggle('on', Number(el.dataset.i)===cur);
  });
}
document.getElementById('side').addEventListener('click', e=>{
  const el = e.target.closest('button[data-i]');
  if(el) select(+el.dataset.i);
});
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') select(cur-1);
  if(e.key==='ArrowRight') select(cur+1);
});
// 深链：?c=8 或 #8，默认第 1 章
const m = location.search.match(/[?&]c=(\d+)/);
buildNav();
select(m ? +m[1]-1 : 0);
</script>
