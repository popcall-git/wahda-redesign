<script>
const CATS = [
  { id:'a', name:'ACCOUNT & PROFILE' },
  { id:'b', name:'SIGN-UP & GUEST MODE' },
  { id:'c', name:'FEEDS & INTERACTION' },
  { id:'d', name:'PLACES & MY HUB' },
  { id:'e', name:'GROWTH PATHS' },
];
const CH = [
  { f:'PROFILE-MERGED-EN.html',            cat:'a', t:'Full Profile Overhaul · Account Switcher × Published Posts' },
  { f:'P002-comparison-EN.html',           cat:'a', t:'Discover Home · Fixed Bottom Nav + Tab Badges' },
  { f:'P003-comparison-EN.html',           cat:'a', t:'Creator Profile × Account Switching' },
  { f:'CREATE-ENTRY-EN.html',              cat:'a', t:'Creation Entry · Publish Hub' },
  { f:'NOTIFICATION-CENTER-EN.html',       cat:'a', t:'Notification Center · Global Inbox' },
  { f:'LOCATION-PRIVACY-EN.html',          cat:'a', t:'Location Display & Privacy' },
  { f:'SIGNUP-comparison-EN.html',         cat:'b', t:'Sign Up Flow Completion' },
  { f:'SIGNUP-STEP23-FLOW-EN.html',        cat:'b', t:'Sign-up Step 2–3 Onboarding' },
  { f:'GUEST-FLOW-EN.html',                cat:'b', t:'Guest Mode' },
  { f:'FEEDS-INTERACTION-IDENTITY-EN.html',cat:'c', t:'P005 Feeds Like / Repost Identity Reveal' },
  { f:'FEEDS-DETAIL-POST-EN.html',         cat:'c', t:'Feeds Detail · Post View' },
  { f:'FEEDS-DETAIL-COMMENTS-EN.html',     cat:'c', t:'Feeds Detail · Comments' },
  { f:'PLACES-BLEND-EN.html',              cat:'d', t:'Places Hybrid Mode Overhaul' },
  { f:'PLACES-VERIFY-EN.html',             cat:'d', t:'Places Enhancement · Community Halal Verified Scoring' },
  { f:'MYHUB-WALLET-EN.html',              cat:'d', t:'My Hub Wallet Entry' },
  { f:'PATH-PRAYER-FUNNEL-EN.html',        cat:'e', t:'Prayer Conversion Funnel · 5-Step Trust Path' },
];

const side = document.getElementById('side');
const frame = document.getElementById('frame');
const open = document.getElementById('open');
let cur = -1;

function buildNav(){
  side.innerHTML = CATS.map(g=>`
    <div class="g"><div class="g-t">${g.name}</div>
      ${CH.map((c,i)=> c.cat===g.id ? `<button data-i="${i}"><span class="no">${String(i+1).padStart(2,'0')}</span><span>${c.t}</span></button>` : '').join('')}
    </div>`).join('');
}
function select(i){
  cur = (i+CH.length)%CH.length;
  frame.src = CH[cur].f;
  open.href = CH[cur].f;
  document.querySelectorAll('#side button').forEach(el=>{
    el.classList.toggle('on', Number(el.dataset.i)===cur);
  });
}
document.getElementById('side').addEventListener('click', e=>{
  const el = e.target.closest('button[data-i]');
  if(el) select(+el.dataset.i);
});
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') select(cur-1);
  if(e.key==='ArrowRight') select(cur+1);
});
// Deep link: ?c=8 or #8, defaults to chapter 1
const m = location.search.match(/[?&]c=(\d+)/);
buildNav();
select(m ? +m[1]-1 : 0);
</script>
